services:
  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000"
      - "15432:15432"
    env_file: .env
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: ${NEON_HOST}
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: ${NEON_DATABASE}
      CUBEJS_DB_USER: ${NEON_USER}
      CUBEJS_DB_PASS: ${NEON_PASSWORD}
      CUBEJS_DB_SSL: "true"
      CUBEJS_DS_BIGQUERY_DB_TYPE: bigquery
      CUBEJS_DS_BIGQUERY_DB_BQ_PROJECT_ID: sns-query
      CUBEJS_DS_BIGQUERY_DB_BQ_LOCATION: asia-northeast1
      CUBEJS_DS_BIGQUERY_DB_BQ_KEY_FILE: /cube/conf/bq-key.json
      CUBEJS_DS_DUCKDB_DB_TYPE: duckdb
      CUBEJS_DS_DUCKDB_DB_DUCKDB_DATABASE_PATH: ":memory:"
      CUBEJS_DS_DUCKDB_DB_DUCKDB_S3_ENDPOINT: ${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      CUBEJS_DS_DUCKDB_DB_DUCKDB_S3_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      CUBEJS_DS_DUCKDB_DB_DUCKDB_S3_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      CUBEJS_DS_DUCKDB_DB_DUCKDB_S3_REGION: auto
      CUBEJS_DS_DUCKDB_DB_DUCKDB_S3_URL_STYLE: path
      CUBEJS_DS_DUCKDB_DB_DUCKDB_S3_USE_SSL: "true"
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_SCHEMA_PATH: model
      CUBEJS_DATASOURCES: default,bigquery,duckdb
      CUBEJS_PG_SQL_PORT: "15432"
    volumes:
      - ./model:/cube/conf/model
      - ./bq-key.json:/cube/conf/bq-key.json:ro
